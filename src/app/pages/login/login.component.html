<main class="login-shell">
  <div class="login-bg-decor" aria-hidden="true"></div>
  <div class="login-card" role="region" aria-label="Login">
    <div class="login-brand">
      <div class="brand-mark" aria-hidden="true">
        <mat-icon>admin_panel_settings</mat-icon>
      </div>
      <div>
        <div class="brand-title">Employee Management</div>
        <div class="brand-subtitle">Sign in to your account</div>
      </div>
    </div>

    <div class="login-divider"></div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form" novalidate>
      <div class="field-group">
        <label class="field-label" for="username">Username</label>
        <mat-form-field appearance="outline" class="field">
          <input
            matInput
            id="username"
            type="text"
            formControlName="username"
            placeholder="Masukkan username"
            autocomplete="username"
          />
          <mat-icon matPrefix class="field-prefix-icon">person_outline</mat-icon>
          <mat-error *ngIf="submitted && loginForm.controls.username.invalid">
            Username wajib diisi
          </mat-error>
        </mat-form-field>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <mat-form-field appearance="outline" class="field">
          <input
            matInput
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
          />
          <mat-icon matPrefix class="field-prefix-icon">lock_outline</mat-icon>
          <button
            matSuffix
            mat-icon-button
            type="button"
            class="toggle-password-btn"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
            [attr.aria-pressed]="showPassword"
          >
            <mat-icon>{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error *ngIf="submitted && loginForm.controls.password.invalid">
            Password wajib diisi
          </mat-error>
        </mat-form-field>
      </div>

      <div *ngIf="errorMessage" class="error-banner" role="alert">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button
        mat-flat-button
        color="primary"
        class="login-btn"
        type="submit"
      >
        <mat-icon class="btn-icon">login</mat-icon>
        Login
      </button>
    </form>

    <div class="login-footnote">
      Dengan masuk, Anda menyetujui kebijakan penggunaan internal.
    </div>
  </div>
</main>
