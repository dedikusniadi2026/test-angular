<div class="dialog-header">
  <div class="dialog-avatar">
    <mat-icon>person</mat-icon>
  </div>
  <div class="dialog-header-info">
    <h2 class="dialog-name">{{ e.firstName }} {{ e.lastName }}</h2>
    <p class="dialog-meta">&#64;{{ e.username }}&nbsp;&nbsp;·&nbsp;&nbsp;ID #{{ e.id }}</p>
  </div>
  <button mat-icon-button class="close-btn" (click)="close()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-body">

  <div class="info-grid">

    <div class="info-card">
      <div class="info-icon"><mat-icon>alternate_email</mat-icon></div>
      <div class="info-text">
        <div class="info-label">Email</div>
        <div class="info-value">{{ e.email }}</div>
      </div>
    </div>

    <div class="info-card">
      <div class="info-icon"><mat-icon>cake</mat-icon></div>
      <div class="info-text">
        <div class="info-label">Birth Date</div>
        <div class="info-value">{{ formattedBirthDate }}</div>
      </div>
    </div>

    <div class="info-card">
      <div class="info-icon"><mat-icon>payments</mat-icon></div>
      <div class="info-text">
        <div class="info-label">Basic Salary</div>
        <div class="info-value">{{ formattedSalary }}</div>
      </div>
    </div>

    <div class="info-card">
      <div class="info-icon"><mat-icon>groups</mat-icon></div>
      <div class="info-text">
        <div class="info-label">Group</div>
        <div class="info-value">{{ e.group }}</div>
      </div>
    </div>

  </div>

  <div class="status-row">
    <span
      class="status-badge"
      [class.active]="e.status === 'Active'"
      [class.inactive]="e.status === 'Inactive'">
      <span class="status-dot"></span>
      {{ e.status }}
    </span>
  </div>

  <div class="desc-section">
    <div class="desc-label">
      <mat-icon class="desc-icon">notes</mat-icon>
      Description
    </div>
    <p class="desc-text">{{ e.description || '—' }}</p>
  </div>

</mat-dialog-content>

<div class="dialog-footer">
  <button mat-flat-button class="btn-close" (click)="close()">
    OK
  </button>
</div>
