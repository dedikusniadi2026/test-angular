<div class="sidebar-header" [class.sidebar-header--collapsed]="collapsed">

  <ng-container *ngIf="!collapsed">
    <div class="brand-wrap">
      <mat-icon class="brand-icon">shield</mat-icon>
      <span class="brand-name">Bank Mandiri</span>
    </div>
    <button mat-icon-button class="collapse-btn" (click)="toggle()"
      matTooltip="Collapse sidebar" matTooltipPosition="right" aria-label="Collapse sidebar">
      <mat-icon>chevron_left</mat-icon>
    </button>
  </ng-container>

  <ng-container *ngIf="collapsed">
    <button mat-icon-button class="collapse-btn" (click)="toggle()"
      matTooltip="Expand sidebar" matTooltipPosition="right" aria-label="Expand sidebar">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </ng-container>

</div>

<div class="nav-section-label" [class.nav-section-label--hidden]="collapsed">Main Menu</div>

<mat-nav-list>
  @for (menu of menus; track menu.title) {
    <a mat-list-item [routerLink]="menu.link" routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: menu.link === '/dashboard' }"
      class="nav-item" [class.nav-item--collapsed]="collapsed"
      [matTooltip]="collapsed ? menu.title : ''" matTooltipPosition="right">
      <mat-icon>{{ menu.icon }}</mat-icon>
      <span class="nav-title" [class.nav-title--hidden]="collapsed">{{ menu.title }}</span>
    </a>
  }
</mat-nav-list>

<div class="sidebar-footer" [class.sidebar-footer--collapsed]="collapsed">
  <button class="logout-btn" [class.logout-btn--collapsed]="collapsed"
    type="button" (click)="logout()"
    [matTooltip]="collapsed ? 'Sign Out' : ''" matTooltipPosition="right">
    <mat-icon>power_settings_new</mat-icon>
    <span class="logout-text" [class.logout-text--hidden]="collapsed">Sign Out</span>
  </button>
</div>
